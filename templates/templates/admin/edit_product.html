{% extends "base.html" %}
{% block title %}Edit Product | The Sophia Thread{% endblock %}
{% block content %}
<section class="form-section">
  <div class="form-card">
    <p class="eyebrow">ADMIN</p>
    <h1>Edit Product</h1>

    {% if product['image'] %}
      <img class="edit-preview" src="{{ url_for('uploaded_file', filename=product['image']) }}" alt="{{ product['name'] }}">
    {% endif %}

    <form method="post" enctype="multipart/form-data">
      <label>Product/design name *</label>
      <input name="name" value="{{ product['name'] }}" required>

      <label>Price (₹) *</label>
      <input name="price" type="number" min="0" step="0.01" value="{{ product['price'] }}" required>

      <label>Description</label>
      <textarea name="description" rows="5">{{ product['description'] }}</textarea>
<label>Category *</label>
<select name="category" required>
    <option value="Curtains" {% if product['category'] == 'Curtains' %}selected{% endif %}>Curtains</option>
    <option value="Clothing" {% if product['category'] == 'Clothing' %}selected{% endif %}>Clothing</option>
    <option value="Gifts" {% if product['category'] == 'Gifts' %}selected{% endif %}>Gifts</option>
    <option value="Home Decor" {% if product['category'] == 'Home Decor' %}selected{% endif %}>Home Decor</option>
    <option value="Custom Embroidery" {% if product['category'] == 'Custom Embroidery' %}selected{% endif %}>Custom Embroidery</option>
    <option value="Other" {% if product['category'] == 'Other' %}selected{% endif %}>Other</option>
</select>
      <label>Quantity *</label>
      <input name="quantity" type="number" min="0" value="{{ product['quantity'] }}" required>

      <label>Replace photo</label>
      <input name="image" type="file" accept=".jpg,.jpeg,.png,.webp">

      <button class="btn btn-primary full" type="submit">Save Changes</button>
    </form>
  </div>
</section>
{% endblock %}
